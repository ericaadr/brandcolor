<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>erica.adr Brand Colors</title>
  <link rel="stylesheet" href="brand.css">
  <style>
    body { margin: 0; padding: 48px 16px; }
    main { max-width: 720px; margin: 0 auto; }
    .row { display: flex; gap: 16px; align-items: center; margin: 24px 0; flex-wrap: wrap; }
    .label { width: 120px; font-size: 18px; }
    .swatch { width: 180px; height: 110px; border-radius: 0 60px 60px 0; display: flex; align-items: center; padding-left: 24px; box-sizing: border-box; font-size: 18px; box-shadow: 4px 6px 12px rgba(0,0,0,.15); }
    .fonts p { margin: 8px 0; }
  </style>
</head>
<body>
<main>
  <h1>Kode warna untuk brand erica.adr</h1>
  <div class="row"><div class="label">Warna Utama</div>
    <div class="swatch" style="background:var(--color-red);color:var(--text-cream)">#980d11</div>
    <div class="swatch" style="background:var(--color-cream);color:var(--text-black)">#fff3ed</div></div>
  <div class="row"><div class="label">Warna Sekunder</div>
    <div class="swatch" style="background:var(--color-pink);color:var(--text-black)">#ffbfb3</div>
    <div class="swatch" style="background:var(--color-gold);color:var(--text-cream)">#d9b77c</div></div>
  <div class="row"><div class="label">Warna Tulisan</div>
    <div class="swatch" style="background:var(--text-black);color:var(--text-cream)">#000000</div>
    <div class="swatch" style="background:var(--text-red);color:var(--text-cream)">#980d11</div>
    <div class="swatch" style="background:var(--text-cream);color:var(--text-black)">#fff3ed</div></div>
  <section class="fonts">
    <h1 style="font-weight:400">Title: Montserrat</h1>
    <h2 style="font-weight:400">Subtitle 1: Public Sans</h2>
    <h3 style="font-size:28px;font-weight:400">Subtitle 2: Soli Px</h3>
    <p style="font-family:var(--font-title);font-size:28px">Subtitle 2: Montserrat</p>
    <p>Body text: Public Sans</p>
    <p class="accent">Accent text: Public Sans</p>
  </section>
</main>
</body>
</html>
